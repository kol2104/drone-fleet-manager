spring:
  application:
    name: device-registry
  datasource:
    url: ${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/drone_fleet}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
  elasticsearch:
    uris: ${ELASTICSEARCH_URL:http://localhost:9200}

device-registry:
  minimum-battery-percentage: ${DRONE_MINIMUM_BATTERY_PERCENTAGE:20}
  audit:
    executor:
      core-pool-size: 2
      max-pool-size: 8
      queue-capacity: 500

server:
  port: ${DEVICE_REGISTRY_PORT:8081}
  servlet:
    context-path: /

logging:
  level:
    com.example.drone: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.elasticsearch: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
